<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <rect width="1600" height="920" fill="#f3f5f7"/>

  <defs>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.09"/>
    </filter>

    <!-- A: compact app tile. The chain sits behind the cloud and exits down-right. -->
    <g id="mark-a">
      <rect x="8" y="8" width="240" height="240" rx="52" fill="#1769e0"/>
      <g transform="rotate(-35 159 164)" fill="none" stroke="#ffbf3f" stroke-width="17">
        <rect x="136" y="112" width="46" height="78" rx="23"/>
        <rect x="136" y="166" width="46" height="78" rx="23"/>
      </g>
      <path d="M62 144 C43 144 28 129 28 110 C28 91 43 76 62 76 C68 76 74 78 79 81 C89 55 113 38 142 38 C178 38 207 66 209 102 C226 106 238 120 238 138 C238 159 221 176 200 176 H66 C44 176 27 160 27 140 C27 124 37 111 51 105"
            fill="#ffffff"/>
      <path d="M151 170 L165 181" fill="none" stroke="#ffbf3f" stroke-width="17" stroke-linecap="round"/>
    </g>

    <!-- B: standalone brand mark with a shared blue/green junction. -->
    <g id="mark-b">
      <path d="M62 147 C41 147 25 131 25 111 C25 90 42 74 63 74 C69 74 75 75 80 78 C91 52 116 35 145 35 C181 35 210 62 213 98 C230 103 242 118 242 136 C242 157 225 174 204 174 H64 C42 174 25 158 25 138"
            fill="#1856b8"/>
      <g transform="rotate(-36 165 168)" fill="none" stroke="#20a879" stroke-width="18">
        <rect x="142" y="111" width="46" height="80" rx="23"/>
        <rect x="142" y="166" width="46" height="80" rx="23"/>
      </g>
      <path d="M146 164 L163 177" fill="none" stroke="#20a879" stroke-width="18" stroke-linecap="round"/>
      <circle cx="154" cy="171" r="8" fill="#1856b8"/>
    </g>

    <!-- C: the cloud edge becomes an angular connector before resolving into links. -->
    <g id="mark-c">
      <path d="M61 143 C41 143 26 128 26 109 C26 89 42 73 62 73 C69 73 75 75 80 78 C91 52 116 36 144 36 C179 36 207 62 211 96 C230 100 243 116 243 135 C243 156 226 173 205 173 H72"
            fill="none" stroke="#172033" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M72 173 H126 L111 194 L145 190 L132 215 L163 209"
            fill="none" stroke="#f05b44" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="rotate(-53 174 197)" fill="none" stroke="#f05b44" stroke-width="17">
        <rect x="153" y="158" width="42" height="76" rx="21"/>
        <rect x="153" y="208" width="42" height="76" rx="21"/>
      </g>
    </g>
  </defs>

  <text x="72" y="70" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#171a1f">SaveLink 图标概念 · 云链</text>
  <text x="72" y="108" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#68717d">云朵向右下延伸出两个链环；同时观察 64 / 32 / 16 px 的识别度</text>

  <g transform="translate(60 150)">
    <rect width="470" height="690" rx="8" fill="#ffffff" filter="url(#card-shadow)"/>
    <text x="34" y="51" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171a1f">A · 应用图标感</text>
    <text x="34" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#68717d">最醒目，缩小后最稳定</text>
    <g transform="translate(107 118)"><use href="#mark-a"/></g>
    <line x1="34" y1="410" x2="436" y2="410" stroke="#e6e9ed"/>
    <text x="34" y="451" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#68717d">实际尺寸预览</text>
    <g transform="translate(50 485) scale(.25)"><use href="#mark-a"/></g>
    <g transform="translate(157 501) scale(.125)"><use href="#mark-a"/></g>
    <g transform="translate(232 509) scale(.0625)"><use href="#mark-a"/></g>
    <text x="50" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">64 px</text>
    <text x="157" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">32 px</text>
    <text x="232" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">16 px</text>
    <rect x="34" y="612" width="402" height="46" rx="7" fill="#f4f6f8"/>
    <g transform="translate(49 619) scale(.125)"><use href="#mark-a"/></g>
    <text x="94" y="642" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#313842">SaveLink</text>
    <circle cx="406" cy="635" r="12" fill="#20a879"/>
  </g>

  <g transform="translate(565 150)">
    <rect width="470" height="690" rx="8" fill="#ffffff" filter="url(#card-shadow)"/>
    <text x="34" y="51" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171a1f">B · 品牌标记感</text>
    <text x="34" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#68717d">更轻、更像独立 Logo</text>
    <rect x="107" y="118" width="256" height="256" rx="52" fill="#f1f6fd"/>
    <g transform="translate(107 118)"><use href="#mark-b"/></g>
    <line x1="34" y1="410" x2="436" y2="410" stroke="#e6e9ed"/>
    <text x="34" y="451" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#68717d">实际尺寸预览</text>
    <rect x="50" y="485" width="64" height="64" rx="13" fill="#f1f6fd"/>
    <g transform="translate(50 485) scale(.25)"><use href="#mark-b"/></g>
    <rect x="157" y="501" width="32" height="32" rx="7" fill="#f1f6fd"/>
    <g transform="translate(157 501) scale(.125)"><use href="#mark-b"/></g>
    <rect x="232" y="509" width="16" height="16" rx="4" fill="#f1f6fd"/>
    <g transform="translate(232 509) scale(.0625)"><use href="#mark-b"/></g>
    <text x="50" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">64 px</text>
    <text x="157" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">32 px</text>
    <text x="232" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">16 px</text>
    <rect x="34" y="612" width="402" height="46" rx="7" fill="#f4f6f8"/>
    <rect x="49" y="619" width="32" height="32" rx="7" fill="#f1f6fd"/>
    <g transform="translate(49 619) scale(.125)"><use href="#mark-b"/></g>
    <text x="94" y="642" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#313842">SaveLink</text>
    <circle cx="406" cy="635" r="12" fill="#20a879"/>
  </g>

  <g transform="translate(1070 150)">
    <rect width="470" height="690" rx="8" fill="#ffffff" filter="url(#card-shadow)"/>
    <text x="34" y="51" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#171a1f">C · 闪电动势</text>
    <text x="34" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#68717d">最贴近“云里伸出链子”</text>
    <rect x="107" y="118" width="256" height="256" rx="52" fill="#f7f8fa"/>
    <g transform="translate(107 118)"><use href="#mark-c"/></g>
    <line x1="34" y1="410" x2="436" y2="410" stroke="#e6e9ed"/>
    <text x="34" y="451" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#68717d">实际尺寸预览</text>
    <rect x="50" y="485" width="64" height="64" rx="13" fill="#f7f8fa"/>
    <g transform="translate(50 485) scale(.25)"><use href="#mark-c"/></g>
    <rect x="157" y="501" width="32" height="32" rx="7" fill="#f7f8fa"/>
    <g transform="translate(157 501) scale(.125)"><use href="#mark-c"/></g>
    <rect x="232" y="509" width="16" height="16" rx="4" fill="#f7f8fa"/>
    <g transform="translate(232 509) scale(.0625)"><use href="#mark-c"/></g>
    <text x="50" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">64 px</text>
    <text x="157" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">32 px</text>
    <text x="232" y="572" font-family="Segoe UI, sans-serif" font-size="13" fill="#7b8490">16 px</text>
    <rect x="34" y="612" width="402" height="46" rx="7" fill="#f4f6f8"/>
    <rect x="49" y="619" width="32" height="32" rx="7" fill="#f7f8fa"/>
    <g transform="translate(49 619) scale(.125)"><use href="#mark-c"/></g>
    <text x="94" y="642" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#313842">SaveLink</text>
    <circle cx="406" cy="635" r="12" fill="#20a879"/>
  </g>
</svg>
