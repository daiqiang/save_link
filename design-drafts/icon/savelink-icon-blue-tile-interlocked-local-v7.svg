      <rect
        x="136"
        y="164"
        width="46"
        height="80"
        rx="23"
        stroke="#ffbf3f"
        stroke-width="17"
      />
      <rect
        x="136"
        y="108"
        width="46"
        height="80"
        rx="23"
        stroke="#ffffff"
