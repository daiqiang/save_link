<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile-clip">
      <rect x="8" y="8" width="240" height="240" rx="52"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="#1769e0"/>

    <path
      d="M62 144 C43 144 28 129 28 110 C28 91 43 76 62 76 C68 76 74 78 79 81 C89 55 113 38 142 38 C178 38 207 66 209 102 C226 106 238 120 238 138 C238 159 221 176 200 176 H66 C44 176 27 160 27 140 C27 124 37 111 51 105"
      fill="#ffffff"
    />

    <g
      transform="rotate(-35 159 176)"
      fill="none"
      stroke="#ffbf3f"
      stroke-width="17"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Start with two complete overlapping rings. -->
      <rect x="136" y="164" width="46" height="80" rx="23"/>
      <rect x="136" y="108" width="46" height="80" rx="23"/>

      <!-- At the upper-right crossing, the upper ring passes over the lower
           ring. The crossing sits on the white cloud. -->
      <path
        d="M168 186 C176 182 181 174 182 166"
        stroke="#ffffff"
        stroke-width="27"
      />
      <path d="M168 186 C176 182 181 174 182 166"/>

      <!-- At the lower-left crossing, the lower ring passes back over the
           upper ring. This crossing sits on the blue tile. -->
      <path
        d="M136 187 C136 178 140 171 147 167"
        stroke="#1769e0"
        stroke-width="27"
      />
      <path d="M136 187 C136 178 140 171 147 167"/>
    </g>
  </g>
</svg>
