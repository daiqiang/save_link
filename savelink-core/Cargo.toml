[package]
name = "savelink-core"
version = "0.1.0"
edition = "2021"
description = "SaveLink 本地存档核心：测试先行骨架（实现为 todo!，测试为红灯）"

[dev-dependencies]

[dependencies]
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
